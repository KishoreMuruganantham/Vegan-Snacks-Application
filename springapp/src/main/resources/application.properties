server.port=8080
spring.application.name=springapp

# ---------------------------------------------------------------------------
# Data source - embedded H2 (in-memory) so the API boots with zero setup.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:vegansnacks;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------------
# Hibernate / JPA
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false

# ---------------------------------------------------------------------------
# JSON serialisation
# ---------------------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=always

# ---------------------------------------------------------------------------
# Error handling - surface the exception message in the error payload.
# ---------------------------------------------------------------------------
server.error.include-message=always
server.error.include-binding-errors=always
